name: CI

on:
  pull_request:
  push:
    branches: [v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, contract and type tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Builds dist/ (bundle + declarations), then runs the runtime and type tests.
      - run: npm test

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Findings are inherited from the dev tooling and handled in dependency
      # PRs, so the audit reports without failing. Production dependencies: none.
      - run: npm audit --json > audit-full.json || true
      - run: npm audit --omit=dev --json > audit-prod.json || true
      - name: Summarize
        run: |
          node -e '
            for (const f of ["audit-full.json", "audit-prod.json"]) {
              const v = require("./" + f).metadata.vulnerabilities;
              console.log(f, JSON.stringify(v));
            }' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: npm-audit
          path: audit-*.json
          retention-days: 14
